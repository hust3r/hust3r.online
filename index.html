<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUSTERS WEB PAGE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
            transition: background 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        h1 {
            font-size: 44px;
            color: #f8fafc;
            margin-bottom: 6px;
            font-weight: 400;
            letter-spacing: 6px;
            font-family: 'Courier New', monospace;
        }

        .subtitle {
            color: #64748b;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .cards-container {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.4);
            border-radius: 14px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .card:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.15);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 38px;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-title {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .card:hover .card-title {
            color: #f8fafc;
        }

        /* --- MODELE I WIDOKI --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 8, 17, 0.8);
            backdrop-filter: blur(8px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(71, 85, 105, 0.6);
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-view {
            display: none;
            flex-direction: column;
        }

        .modal-view.active-view {
            display: flex;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content h2 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* Widok 1: Cytat */
        .quote {
            font-size: 17px;
            font-style: italic;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        
        .quote-author {
            text-align: right;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* Widok 2: Biblioteka (Ulepszone podmenu) */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .project-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(71, 85, 105, 0.5);
            color: #e2e8f0;
            padding: 16px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-btn::after {
            content: '›';
            font-size: 20px;
            color: #64748b;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .project-btn:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: #38bdf8;
            color: #ffffff;
            transform: translateX(4px);
        }

        .project-btn:hover::after {
            transform: translateX(3px);
            color: #38bdf8;
        }

        /* Widok 3: PCB Detale */
        .scrollable-desc {
            overflow-y: auto;
            text-align: left;
            padding-right: 10px;
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
            max-height: 45vh; 
        }

        .scrollable-desc p {
            margin-bottom: 16px;
            text-align: justify;
        }
        
        .scrollable-desc::-webkit-scrollbar {
            width: 5px;
        }
        .scrollable-desc::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4); 
            border-radius: 10px;
        }
        .scrollable-desc::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 10px;
        }
        .scrollable-desc::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease;
            border: 1px solid rgba(51, 65, 85, 0.8);
        }

        .gallery img:hover {
            transform: scale(1.03);
            border-color: #38bdf8;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
        }

        .close-btn {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.6);
            color: #cbd5e1;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .close-btn:hover {
            background: rgba(71, 85, 105, 0.8);
            color: #ffffff;
            border-color: #94a3b8;
        }

        .next-btn {
            background: #0284c7;
            border: 1px solid #0369a1;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .next-btn:hover {
            background: #0ea5e9;
        }

        /* --- LIGHTBOX --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 23, 0.95);
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border: 1px solid rgba(71, 85, 105, 0.6);
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #94a3b8;
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: #ffffff;
        }

        .shrek-img-style {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 12px;
            object-fit: cover;
        }

        .footer-text {
            text-align: center;
            margin-top: 35px;
            color: #64748b;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .shrek-trigger {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .shrek-trigger:hover {
            color: #22c55e;
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 36px;
            }
            .cards-container {
                padding: 16px;
            }
            .card {
                min-height: 120px;
                padding: 20px 16px;
            }
        }
    </style>
</head>
